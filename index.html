<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To. 정호오빠 ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ⭐ 별 배경 -->
    <div id="stars"></div>

    <!-- 🌙 달 -->
    <div class="moon"></div>

    <!-- ⭐ 별똥별 -->
    <div class="shooting-star"></div>

    <!-- 메인 -->
    <section class="hero">

        <h3>To.</h3>

        <h1>정호오빠</h1>

        <p>
            우리의 800일을 담은<br>
            작은 우주에 초대할게.
        </p>

        <button id="openBtn">
            💌 편지 열기
        </button>

    </section>



    <!-- 편지 -->

    <section id="letterSection" class="hidden">

        <div class="letter">

            <h2>2026.07.27</h2>

            <h1>800 Days</h1>

            <div id="typing"></div>

        </div>

    </section>



    <!-- 추억 -->

    <section class="memory">

        <h2>✨ 우리의 시간</h2>

        <div class="cards">

            <div class="card">
                🌙
                <h3>처음</h3>
                <p>
                    우리의 시작은
                    생각보다 훨씬 특별했어.
                </p>
            </div>

            <div class="card">
                ⭐
                <h3>웃음</h3>
                <p>
                    같이 웃었던 날들이
                    아직도 선명해.
                </p>
            </div>

            <div class="card">
                🤍
                <h3>오늘</h3>
                <p>
                    어느새 800일.
                    지금도 함께라서 행복해.
                </p>
            </div>

        </div>

    </section>



    <!-- 카운터 -->

    <section class="counter">

        <h2>우리의 시간</h2>

        <div class="days">

            <span id="days">
                800
            </span>

            DAYS

        </div>

        <p>
            앞으로도<br>
            900일, 1000일,<br>
            그 이후까지.
        </p>

    </section>



    <!-- 마지막 -->

    <section class="ending">

        <h2>
            마지막으로
        </h2>

        <button id="loveBtn">
            눌러봐 🤍
        </button>

        <h1 id="loveText">
            사랑해.
        </h1>

    </section>



    <!-- 하트 -->
    <div id="hearts"></div>

    <script src="script.js"></script>

</body>

</html>
